<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Track Order | Nutritop</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f6f6f6; margin: 0; padding: 24px; }
    .wrap { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,.08); }
    h1 { margin-top: 0; color: #1A6B3C; }
    .row { display: grid; gap: 10px; }
    input, button { width: 100%; padding: 12px; font-size: 16px; border-radius: 8px; }
    input { border: 1px solid #ddd; }
    button { border: 0; background: #1A6B3C; color: #fff; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .7; cursor: not-allowed; }
    .or { text-align: center; color: #777; font-size: 13px; }
    .card { margin-top: 16px; border: 1px solid #e6e6e6; border-radius: 10px; padding: 14px; display: none; }
    .status { font-weight: 700; }
    .hint { font-size: 12px; color: #777; margin-top: 8px; }
    .error { color: #b00020; margin-top: 10px; min-height: 20px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Track Your Order</h1>
    <p>Enter your Order ID (NT...) or phone number.</p>

    <div class="row">
      <input id="orderId" placeholder="Order ID (e.g. NT1712345678901)" />
      <div class="or">OR</div>
      <input id="phone" placeholder="Phone number" maxlength="10" />
      <button id="trackBtn">Track Order</button>
    </div>

    <p class="error" id="error"></p>

    <div class="card" id="result">
      <p><strong>Order ID:</strong> <span id="rOrderId"></span></p>
      <p><strong>Status:</strong> <span class="status" id="rStatus"></span></p>
      <p><strong>Product:</strong> <span id="rProduct"></span></p>
      <p><strong>Payment:</strong> <span id="rPayment"></span></p>
      <p class="hint">Possible statuses: CONFIRMED, PACKED, OUT_FOR_DELIVERY, DELIVERED</p>
    </div>
  </div>

  <script>
    const btn = document.getElementById('trackBtn');
    const errorEl = document.getElementById('error');
    const card = document.getElementById('result');

    btn.addEventListener('click', async () => {
      const orderId = document.getElementById('orderId').value.trim();
      const phone = document.getElementById('phone').value.trim();
      errorEl.textContent = '';
      card.style.display = 'none';

      if (!orderId && !phone) {
        errorEl.textContent = 'Please enter order ID or phone.';
        return;
      }

      if (phone && !/^\d{10}$/.test(phone)) {
        errorEl.textContent = 'Phone must be 10 digits.';
        return;
      }

      try {
        btn.disabled = true;
        btn.textContent = 'Tracking...';

        const qs = new URLSearchParams();
        if (orderId) qs.set('orderId', orderId);
        if (!orderId && phone) qs.set('phone', phone);

        const res = await fetch(`/.netlify/functions/get-order?${qs.toString()}`);
        const data = await res.json();

        if (!res.ok || !data.success) {
          throw new Error(data.message || 'Order not found');
        }

        const { order } = data;
        document.getElementById('rOrderId').textContent = order.orderId;
        document.getElementById('rStatus').textContent = order.status;
        document.getElementById('rProduct').textContent = order.product;
        document.getElementById('rPayment').textContent = order.payment;
        card.style.display = 'block';
      } catch (err) {
        errorEl.textContent = err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Track Order';
      }
    });
  </script>
</body>
</html>
