<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Track Order | Nutritop</title>
  <style>
    :root{--green:#1A6B3C;--cream:#FDFAF4;--paper:#F5F0E8;--brown:#3D2608;--mocha:#7A5030;--muted:#9A8470;--text:#1E1408;--white:#fff;--border:rgba(61,38,8,.1);--shadow:0 10px 30px rgba(61,38,8,.08)}
    *{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:var(--paper);color:var(--text)}
    .wrap{max-width:640px;margin:0 auto;padding:28px 16px 48px}
    .card{background:var(--white);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:24px}
    h1{margin:0 0 8px;font-size:30px;color:var(--brown)}
    p{margin:0 0 18px;color:var(--mocha);line-height:1.6}
    .row{display:grid;gap:12px}
    input,button{width:100%;padding:14px 16px;border-radius:10px;font-size:16px}
    input{border:1px solid var(--border);background:var(--cream)}
    button{border:0;background:var(--green);color:#fff;font-weight:700;cursor:pointer}
    button:disabled{opacity:.7;cursor:not-allowed}
    .result{margin-top:18px;border:1px solid var(--border);border-radius:14px;padding:16px;background:var(--cream);display:none}
    .status{font-weight:700;color:var(--green)}
    .error{margin-top:12px;color:#b00020;min-height:20px}
    .label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:10px}
    .value{font-size:18px;font-weight:700;color:var(--brown)}
    .hint{font-size:12px;color:var(--muted);margin-top:10px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Track Your Order</h1>
      <p>Enter your Tracking ID or phone number.</p>
      <div class="row">
        <input id="trackInput" placeholder="Tracking ID or Phone" />
        <button id="trackBtn" type="button">Track</button>
      </div>
      <div id="error" class="error"></div>
      <div id="result" class="result">
        <div class="label">Status</div>
        <div id="status" class="status"></div>
        <div class="label">Tracking ID</div>
        <div id="trackingId" class="value"></div>
      </div>
      <div class="hint">Order Received 🟡 · Out for Delivery 🚚 · Delivered ✅</div>
    </div>
  </div>
  <script>
    const BASE_ID = 'app2mBKhvibO1VjD3';
    const TABLE = 'Tracking';
    const TOKEN = 'pat58Jpg0PbnPkxCG';
    const input = document.getElementById('trackInput');
    const btn = document.getElementById('trackBtn');
    const err = document.getElementById('error');
    const result = document.getElementById('result');
    const statusEl = document.getElementById('status');
    const trackingIdEl = document.getElementById('trackingId');
    const mapStatus = (s='') => {
      const v = String(s).trim().toLowerCase();
      if (v === 'delivered') return '✅ Delivered';
      if (v === 'out for delivery') return '🚚 Out for Delivery';
      return '🟡 Order Received';
    };
    const esc = (v='') => String(v).replace(/'/g, "\\'");
    btn.addEventListener('click', async () => {
      const q = input.value.trim();
      err.textContent = '';
      result.style.display = 'none';
      if (!q) { err.textContent = 'No order found'; return; }
      btn.disabled = true; btn.textContent = 'Tracking...';
      try {
        const formula = q.match(/^\d{10}$/)
          ? `{Phone}='${esc(q)}'`
          : `OR({Phone}='${esc(q)}', {Tracking Id}='${esc(q)}')`;
        const url = new URL(`https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(TABLE)}`);
        url.searchParams.set('maxRecords', '1');
        url.searchParams.set('filterByFormula', formula);
        const res = await fetch(url.toString(), { headers: { Authorization: `Bearer ${TOKEN}` } });
        const data = await res.json();
        const row = data.records && data.records[0] && data.records[0].fields;
        if (!row) { err.textContent = 'No order found'; return; }
        statusEl.textContent = mapStatus(row.Status || row.status || 'Order Received');
        trackingIdEl.textContent = row['Tracking Id'] || row.TrackingId || row.TrackingID || row['Tracking ID'] || '-';
        result.style.display = 'block';
      } catch (e) {
        err.textContent = 'No order found';
      } finally {
        btn.disabled = false; btn.textContent = 'Track';
      }
    });
  </script>
</body>
</html>
